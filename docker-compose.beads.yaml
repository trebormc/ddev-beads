#ddev-generated
# Beads (bd) task tracker container for DDEV
# Provides git-backed task tracking shared by all AI containers
# Install: ddev add-on get trebormc/ddev-beads

services:
  beads:
    container_name: ddev-${DDEV_SITENAME}-beads
    hostname: beads
    build:
      context: .
      dockerfile: beads-build/Dockerfile.beads
      args:
        USER_UID: ${DDEV_UID:-1000}
        USER_GID: ${DDEV_GID:-1000}
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    restart: "no"
    user: "${DDEV_UID:-1000}:${DDEV_GID:-1000}"
    working_dir: /var/www/html

    depends_on:
      - web

    volumes:
      - ../:/var/www/html
      - ddev-global-cache:/mnt/ddev-global-cache

    environment:
      - DDEV_SITENAME
      - IS_DDEV_PROJECT=true
      - TZ=${TZ:-UTC}

    stdin_open: true
    tty: true

    networks:
      - default
      - ddev_default

    # Initialize Beads database if needed, then stay idle for on-demand bd/SSH calls.
    # bd init must never touch the project's git state:
    #   BEADS_DIR set    -> skips `git init` (no .git created in non-git projects)
    #   --stealth        -> no auto-commit, no hooks (core.hooksPath), no tracked
    #                       .gitignore changes (uses .git/info/exclude instead)
    #   --skip-agents    -> no AGENTS.md / CLAUDE.md / .claude files in the project
    command: ["bash", "-c", "if [ ! -d .beads/dolt ]; then BEADS_DIR=/var/www/html/.beads bd init --prefix \"${DDEV_SITENAME:-bd}\" --stealth --skip-agents 2>/dev/null || true; fi && sleep infinity"]

networks:
  ddev_default:
    name: ddev_default
    external: true

volumes:
  ddev-global-cache:
    external: true
